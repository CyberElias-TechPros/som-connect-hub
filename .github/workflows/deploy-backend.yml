name: Deploy backend

# Deploys the som-connect-api worker on push to main (cyberelias-tk account).
# NOTE: the D1 schema is a single hand-applied file (worker/src/db/schema.sql
# + seed.sql) with no migrations journal, so there is deliberately no
# `migrations apply` step here. Schema changes must be applied by hand with
# `wrangler d1 execute --file=...`. Worker secret JWT_SECRET must exist (set
# once via `wrangler secret put`); this workflow never touches it.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (cyberelias-tk account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://som-connect-api.cyberelias-tk.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::som-connect-api health check failed"; exit 1; }
