<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SOM CONNECT — School of Ministry Streaming Platform</title>
    <meta name="description" content="SOM CONNECT is the premium spiritual streaming platform for School of Ministry. Watch teachings, daily confessions, Rhapsody of Realities, join Q&A sessions, and connect with believers worldwide." />
    <meta name="keywords" content="SOM Connect, School of Ministry, spiritual growth, Christian teachings, Rhapsody of Realities, daily confessions, Christ Embassy" />
    <meta name="author" content="SOM CONNECT" />
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0..1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:title" content="SOM CONNECT — School of Ministry Streaming Platform" />
    <meta property="og:description" content="Premium spiritual streaming: teachings, daily tools, community, Q&A sessions. Your journey, elevated." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/src/images/som-logo.png" />
    <meta property="og:site_name" content="SOM CONNECT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOM CONNECT" />
    <meta name="twitter:description" content="Premium spiritual streaming platform for School of Ministry." />
    <meta name="twitter:image" content="/src/images/som-logo.png" />

    <!-- PWA -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SOM CONNECT",
      "description": "School of Ministry Streaming Platform",
      "logo": "/src/images/som-logo.png",
      "url": "https://som-connect.com"
    }
    </script>

    <style>
      /* Critical CSS for instant premium feel */
      html { background: #0A0E1A; }
      body { margin: 0; background: #FAF8F5; }
      #root { min-height: 100vh; }
      /* Prevent FOUC */
      .no-js #root { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui;">
        <h1>SOM CONNECT requires JavaScript</h1>
        <p>Please enable JavaScript to experience SOM CONNECT.</p>
      </div>
    </noscript>
  </body>
</html>
